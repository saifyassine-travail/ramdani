# Central dataset locations. (WSL2 paths — Windows C:\... is /mnt/c/... here.)
#
# Datasets live on the RAM disk (/mnt/ramdisk) for maximum I/O speed.
# Run `make ramdisk` to mount the RAM disk and copy datasets from Windows.
# Each value may also be overridden by an environment variable of the same
# UPPERCASE name, e.g. export KITS23=/mnt/c/...

# Full-body CT (NIfTI), 117 organs — used by TASK_TOTALSEG_INFER
TOTALSEG_DATASET: /mnt/ramdisk/totalseg

# Kidney + tumor CT (NIfTI) — TASK_KITS_2D
KITS23: /mnt/ramdisk/kits23

# Official TotalSegmentator repo / tool checkout (optional; pip install is enough)
TOTALSEG_REPO: /mnt/c/Users/dell/Desktop/ramdani/radiology-lab

# Chest X-rays (DICOM + CSV) — TASK_RSNA_PNEUMONIA
RSNA_PNEUMONIA: /mnt/ramdisk/rsna

# Lung nodule CT (DICOM + XML) — TASK_LIDC_NODULE_CLS
LIDC_IDRI: /mnt/ramdisk/lidc

# NIH ChestX-ray14 (PNG + Data_Entry_2017.csv) — TASK_NIH_CXR14
NIH_CXR14: /mnt/ramdisk/nih
