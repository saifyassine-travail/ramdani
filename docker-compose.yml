services:

  backend:
    build:
      context: ./backend/mediassist
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - ./backend/mediassist:/var/www
    depends_on:
      - db
    environment:
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: mediassist
  DB_USERNAME: root
  DB_PASSWORD: root


  extraction:
    build:
      context: ./Backend/extraction-service
    container_name: mediassist_extraction
    restart: unless-stopped
    environment:
      # Set GEMINI_API_KEY in .env (get one at https://aistudio.google.com/app/apikey).
      # If unset, the service still starts and returns a clear 502 when scanning.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
    # No published port: reached internally by the frontend as http://extraction:8100

  frontend:
    build: ./frontend
    container_name: next_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - extraction
    environment:
      NEXT_PUBLIC_API_URL: "http://nginx:80"
      # Server-side URL the /api/extract-cin route handler forwards CIN uploads to.
      EXTRACTION_SERVICE_URL: http://extraction:8100

  db:
    image: mysql:8
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mediassist
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend/mediassist:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  db_data:
