# Local "run everything in Docker" overrides:
#  - adds a Postgres container instead of a native host PostgreSQL
#  - points the backend at that container
#  - Ollama is NOT installed: extraction runs in Tesseract-only OCR mode and
#    the patient-summary service is not started.
#  - whatsapp-reminder is not started; the external openwa-network is created
#    manually (docker network create openwa-network).
services:

  db:
    image: postgres:16
    container_name: mediassist_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mediassist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - mediassist_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mediassist"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: mediassist
      DB_USERNAME: postgres
      DB_PASSWORD: root

  extraction:
    environment:
      OCR_ENGINE: tesseract

volumes:
  mediassist_pgdata:
