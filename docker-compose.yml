services:

  backend:
    build:
      context: ./Backend/MediAssist
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - ./Backend/MediAssist:/var/www
      - /var/www/vendor
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: mediassist
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Internal docker hostname for the CIN OCR proxy route (/api/extract-cin)
      EXTRACTION_SERVICE_URL: http://extraction:8100

  extraction:
    build:
      context: ./Backend/extraction-service
    container_name: mediassist_extraction
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
    # No published port: reached internally by the frontend as http://extraction:8100

  frontend:
    build:
      context: ./Frontend
      args:
        # Baked into the client bundle at build time (Next.js NEXT_PUBLIC_* rule) —
        # must be reachable from the browser on the host, not an internal Docker hostname.
        NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
    container_name: next_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - extraction
    environment:
      # Server-side URL the /api/extract-cin route handler forwards CIN uploads to.
      EXTRACTION_SERVICE_URL: http://extraction:8100

  db:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mediassist
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./Backend/MediAssist:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  db_data:
